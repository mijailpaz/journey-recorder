<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Journey Recorder – Screen Capture</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        text-align: center;
      }

      h1 {
        font-size: 20px;
        margin: 0;
      }

      p {
        margin: 0;
        max-width: 420px;
        line-height: 1.4;
      }

      .status {
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>Journey Recorder</h1>
    <p>Choose the tab or window you want to capture. You can return to the inspected tab after granting permission.</p>
    <p class="status" id="status">Waiting for permission prompt…</p>
    <script type="module" src="recording_screen.js"></script>
  </body>
</html>
